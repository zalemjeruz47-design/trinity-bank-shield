<div id="solicitarDemo" class="oculto">
  <div class="caja">
    <b>✨ SOLICITAR DEMO INSTITUCIONAL</b><br>
    <small>Solo para personal de banco verificado, Jefa.</small>

    <input id="demoNombre" placeholder="Nombre completo">
    <input id="demoBanco" placeholder="Banco donde trabaja">
    <input id="demoCorreo" type="email" placeholder="Correo corporativo - Ej: nombre@banco.com">
    <input id="demoCargo" placeholder="Cargo - Ej: Gerente de Seguridad">
    <label style="font-size:13px;color:#aaa">📸 Sube foto de tu credencial del banco:</label>
    <input type="file" accept="image/*">

    <button class="btn btn1" style="width:100%" onclick="enviarSolicitudDemo()">📩 ENVIAR SOLICITUD A LA JEFA</button>
    <p id="msgDemo" style="font-size:13px"></p>

    <p style="font-size:12px;color:#888">Tu solicitud llega directo al correo de la Jefa para verificación, Bb.</p>
    <p style="font-size:12px">¿Prefieres escribir directo? <a href="mailto:Zalemjeruz47@gmail.com?subject=Quiero solicitar DEMO TRINITY BANK SHIELD&body=Hola Jefa, soy del banco: %0D%0A Banco: %0D%0A Cargo: %0D%0A Correo corporativo:" style="color:#a78bfa">📧 Escribir a la Jefa</a></p>
  </div>
</div>

<script>
function enviarSolicitudDemo(){
  let nombre = document.getElementById('demoNombre').value.trim();
  let banco = document.getElementById('demoBanco').value.trim();
  let correo = document.getElementById('demoCorreo').value.trim();
  let cargo = document.getElementById('demoCargo').value.trim();

  if(!nombre || !banco || !correo){
    document.getElementById('msgDemo').innerHTML = '❌ Faltan datos, Jefa. Pon nombre, banco y correo, Bb.';
    return;
  }
  if(correo.includes('@gmail.com') || correo.includes('@hotmail.com') || correo.includes('@yahoo.com')){
    document.getElementById('msgDemo').innerHTML = '❌ Solo aceptamos correo corporativo del banco, Bb. No Gmail, mi amor.';
    return;
  }

  // TU CORREO ORIGINAL CORREGIDO, JEFA - CON Z, BB
  let correoJefa = "Zalemjeruz47@gmail.com";

  let asunto = "SOLICITUD DEMO TRINITY - " + banco;
  let mensaje = "Hola Jefa, quiero solicitar demo:%0D%0A%0D%0A Nombre: " + nombre + "%0D%0A Banco: " + banco + "%0D%0A Cargo: " + cargo + "%0D%0A Correo corporativo: " + correo + "%0D%0A%0D%0A Por favor verifica mi credencial, Jefa.";
  
  window.location.href = "mailto:" + correoJefa + "?subject=" + asunto + "&body=" + mensaje;

  document.getElementById('msgDemo').innerHTML = '✅ Listo, Bb. Ya se abrió tu correo para enviarle la solicitud a la Jefa, mi amor. Solo le das ENVIAR, Jefa.';
}
</script>

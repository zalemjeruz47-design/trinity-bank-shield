<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRINITY BANK SHIELD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#030014;color:#fff}
.top{text-align:center;padding:22px 10px 8px;font-weight:800}
.top span{color:#A78BFA}
.container{max-width:1150px;margin:0 auto;padding:18px;display:flex;gap:30px;flex-wrap:wrap}
.left{flex:1.2;min-width:300px}
.left h1{font-size:52px;line-height:1.05}
.left p.desc{color:#C7C7D1;margin:20px 0;line-height:1.6}
.boxes{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.box{background:#0A0A1A;border:1px solid #2A2A3A;padding:14px;border-radius:12px;width:125px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn-demo{background:linear-gradient(90deg,#8B5CF6,#3B82F6);color:#fff;border:none;padding:15px 20px;border-radius:12px;font-weight:800;cursor:pointer;flex:1}
.btn-acceso{background:#000;color:#fff;border:1px solid #7C3AED;padding:15px 20px;border-radius:12px;font-weight:700;cursor:pointer;flex:1}
.right{flex:1;min-width:300px;background:#050510;border:1px solid #1E3A8A;border-radius:20px;padding:22px}
.big-blue{background:linear-gradient(90deg,#7C3AED,#2563EB);border-radius:14px;padding:18px}
.big-blue h2{font-size:36px;margin:5px 0}
.card{background:#11111F;border-radius:14px;padding:15px;margin-top:12px}
.card p{font-size:13px;color:#999;margin-top:4px}
.footer{text-align:center;color:#666;font-size:12px;padding:15px 10px}
.form-wrap{display:none;max-width:520px;margin:0 auto;padding:10px 15px 40px}
.form-box{background:#070714;border:1px solid #2A1A5E;border-radius:20px;padding:24px}
.form-box h2{text-align:center;font-size:22px}
.form-box p.sub{text-align:center;color:#AAA;font-size:13px;margin:8px 0 18px}
.form-box input,.form-box textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #222;background:#0D0D1E;color:#fff;outline:none;margin-bottom:10px}
.btn-enviar{width:100%;background:linear-gradient(90deg,#7C3AED,#2563EB);color:#fff;border:none;padding:15px;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.btn-volver{width:100%;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:12px;margin-top:12px;cursor:pointer}
.ops{display:none;max-width:1150px;margin:0 auto;padding:15px}
.ops-header{text-align:center;padding:10px}
.ops-header h1{font-size:32px}
.ops-header h1 span{color:#38BDF8}
.ops-header p{color:#AAA;margin-top:8px;font-size:14px}
.ops-stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.stat{flex:1;min-width:140px;background:linear-gradient(90deg,#7C3AED,#2563EB);border-radius:14px;padding:16px;text-align:center}
.stat b{font-size:24px;display:block}
.ops-title{font-size:18px;margin:20px 0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.op-card{background:#0A0A1A;border:1px solid #2A2A3A;border-radius:16px;padding:18px;cursor:pointer}
.op-card h3{font-size:16px;margin:8px 0 6px}
.op-card p{font-size:13px;color:#999;line-height:1.5}
.op-card .tag{display:inline-block;font-size:11px;background:#1E1E35;padding:4px 8px;border-radius:20px;color:#A78BFA;margin-top:8px}
.op-card .live{color:#4ADE80;font-size:12px;font-weight:700}
/* LA RAYITA DE CADA UNO, JEFA */
.ecg{width:100%;height:55px;background:#05051A;border-radius:10px;border:1px solid #1E3A8A;margin:10px 0 6px}
.btn-salir{width:100%;background:#111;border:1px solid #333;color:#fff;padding:13px;border-radius:12px;margin:25px 0;cursor:pointer}
.detalle{display:none;max-width:700px;margin:0 auto;padding:15px}
.detalle-box{background:#070714;border:1px solid #2A1A5E;border-radius:20px;padding:24px}
.detalle-box h2{font-size:26px;margin:10px 0}
.detalle-box p{color:#AAA;line-height:1.6;font-size:14px;margin:10px 0}
.mini{background:#11111F;border-radius:12px;padding:14px;margin-top:12px;font-size:13px;line-height:1.6}
.btn-detalle{width:100%;background:linear-gradient(90deg,#7C3AED,#2563EB);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;margin-top:16px;cursor:pointer}
@media(max-width:800px){
  .container{flex-direction:column;padding:14px}
  .left h1{font-size:34px}
  .box{width:48%}
  .btns{flex-direction:column}
  .grid4{grid-template-columns:1fr 1fr}
  .grid6{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="portada">
  <div class="top">🛡️ <span>TRINITY
